<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Bday Emil</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Verdana,sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;

background:url("mei-cat.gif") center center/cover no-repeat fixed;

display:flex;
justify-content:center;
align-items:center;
}

.window{
width:min(90vw,700px);
min-height:250px;

background:#ececec;
border:3px solid black;

box-shadow:10px 10px 0 rgba(0,0,0,.4);

display:flex;
flex-direction:column;
}

.titlebar{
height:40px;

background:linear-gradient(
90deg,
#2048aa,
#638eff
);

color:white;

display:flex;
align-items:center;

padding:0 12px;

font-weight:bold;
font-size:16px;
}

.content{
padding:35px;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

gap:25px;
}

.message{
font-size:24px;
text-align:center;
line-height:1.4;
}

.buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
}

button{
padding:12px 18px;

border:2px solid black;
background:white;

font-size:16px;
cursor:pointer;

transition:.15s;
}

button:hover{
transform:translateY(-2px);
}

button:disabled{
cursor:not-allowed;
opacity:.4;
}

.gif-screen{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

.gif-screen img{
max-width:80vw;
max-height:60vh;

border:4px solid black;
}

@media(max-width:600px){

.message{
font-size:20px;
}

button{
font-size:14px;
}

}

</style>
</head>
<body>

<div id="app"></div>

<script>

const app = document.getElementById("app");

app.innerHTML = `
<div class="window">
<div class="titlebar">Birthday.exe</div>

<div class="content">

<div class="message">
${text}
</div>

<div class="buttons">
${buttons}
</div>

</div>
</div>
`;

}

"HAPPY BDAY EMIL",

`
<button onclick="sup1()">

`

function showGif(){

function ending(){

`deer Emil, i wish u a great super duper birthday. youre so awesome and kind and funni and aura and stuff and im realli happi that we know each other. today is ur special day and i hope u celebrate it well !!!! i wish i could give u an actual gift not a digital thing i coded :sob: but i hope u like this too ! you is kind you is important and sososoosososososo cool...`,

</script>
</body>
</html>
